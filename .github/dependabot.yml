version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[Dependabot] "

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: "development"
    ignore:
      - dependency-name: 'typo3/*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: "[Dependabot] "
